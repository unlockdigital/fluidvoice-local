name: FluidVoice Local source checks

on:
  push:
    branches: [hardened]
  pull_request:
    branches: [hardened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardened-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-source:
    name: Mac source and deterministic fixtures
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify lockfile agreement
        run: python3 -c 'import json; assert json.load(open("Package.resolved")) == json.load(open("Fluid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"))'
      - name: Static hardening
        run: bash scripts/verify-hardening.sh
      - name: Network policy fixtures
        run: bash scripts/test-hardened-network-policy.sh
      - name: Preference fixtures
        run: bash scripts/test-hardened-preference-checks.sh
      - name: Modifier gesture fixtures
        run: bash scripts/test-direct-input-modifier-gestures.sh
      - name: Model integrity fixtures
        run: python3 scripts/test-pinned-model.py
      - name: Resolve pinned packages
        run: ./build.sh resolve
      - name: Build unsigned application
        run: ./build.sh unsigned

  windows-source:
    name: Windows source build (legacy runtime; experimental)
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.316'
      - name: Restore locked source
        working-directory: platforms/windows
        run: dotnet restore src/FluidVoice.App/FluidVoice.App.csproj --locked-mode
      - name: Build application source
        working-directory: platforms/windows
        run: dotnet build src/FluidVoice.App/FluidVoice.App.csproj -c Release --no-restore
